<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
  <title>SAB</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0a0a0a;
      --card:    #1c1c1e;
      --card2:   #2c2c2e;
      --border:  rgba(84, 84, 88, 0.55);
      --border2: rgba(255, 255, 255, 0.08);
      --accent:  #007AFF;
      --green:   #34C759;
      --orange:  #FF9500;
      --red:     #FF3B30;
      --t1: #ffffff;
      --t2: rgba(255, 255, 255, 0.5);
      --t3: rgba(255, 255, 255, 0.25);
    }

    html, body {
      width: 360px;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      background: var(--bg);
      color: var(--t1);
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      height: 52px;
      padding: 0 14px;
      padding-top: 8px;
      background: rgba(10, 10, 10, 0.9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border2);
      -webkit-app-region: drag;
      gap: 8px;
      flex-shrink: 0;
    }

    /* Spacer to clear macOS traffic lights */
    .tl { width: 68px; flex-shrink: 0; -webkit-app-region: no-drag; }

    .brand { display: flex; align-items: center; gap: 7px; }
    .brand-pill {
      font-size: 11px; font-weight: 800; letter-spacing: 1px;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), #5856D6);
      border-radius: 6px;
      padding: 3px 7px;
    }
    .brand-sep  { font-size: 13px; color: var(--t3); }
    .brand-name { font-size: 13px; font-weight: 600; letter-spacing: -0.2px; white-space: nowrap; }
    .spacer     { flex: 1; }
    .ver-badge  {
      font-size: 10px; font-weight: 600; color: var(--t3);
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border2);
      border-radius: 6px; padding: 2px 6px;
      flex-shrink: 0;
    }

    /* ── Content ── */
    .content {
      padding: 16px 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Status card ── */
    .status-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #3A3A3C;
      flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .dot.starting {
      background: var(--orange);
      box-shadow: 0 0 7px rgba(255,149,0,0.55);
      animation: blink 1.6s ease-in-out infinite;
    }
    .dot.running {
      background: var(--green);
      box-shadow: 0 0 7px rgba(52,199,89,0.6);
    }
    .dot.error {
      background: var(--red);
      box-shadow: 0 0 7px rgba(255,59,48,0.55);
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.35} }

    .status-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .status-label { font-size: 14px; font-weight: 600; }
    .status-sub {
      font-size: 11px; color: var(--t2);
      font-family: 'SF Mono', ui-monospace, monospace;
      font-variant-numeric: tabular-nums;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ── URL list ── */
    .section-title {
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.8px; text-transform: uppercase;
      color: var(--t3); padding: 0 2px; margin-bottom: 5px;
    }
    .url-list { display: flex; flex-direction: column; gap: 3px; }

    .url-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      cursor: pointer;
      transition: background 0.11s, border-color 0.11s;
      -webkit-app-region: no-drag;
    }
    .url-row:hover  { background: var(--card2); border-color: rgba(84,84,88,0.8); }
    .url-row:active { transform: scale(0.985); }

    .url-iface {
      font-size: 10px; font-weight: 600;
      color: var(--t3); width: 52px; flex-shrink: 0;
      letter-spacing: 0.1px;
    }
    .url-addr {
      font-size: 12px; font-weight: 500; color: var(--accent);
      font-family: 'SF Mono', ui-monospace, monospace;
      font-variant-numeric: tabular-nums;
      flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    }
    .url-arrow { font-size: 11px; color: var(--t3); flex-shrink: 0; }

    /* ── Buttons ── */
    .btn-row {
      display: flex; gap: 7px;
      -webkit-app-region: no-drag;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 9px 14px;
      border-radius: 9px; border: 1px solid transparent;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: opacity 0.12s, transform 0.1s, background 0.12s;
    }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.3; cursor: default; pointer-events: none; }

    .btn-primary { flex: 2; background: var(--accent); color: #fff; }
    .btn-primary:hover { opacity: 0.88; }

    .btn-ghost {
      flex: 1;
      background: rgba(255,255,255,0.07);
      border-color: var(--border2);
      color: var(--t2);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.12); color: var(--t1); }

    .btn-danger {
      flex: 1;
      background: rgba(255,59,48,0.1);
      border-color: rgba(255,59,48,0.25);
      color: #FF6961;
    }
    .btn-danger:hover { background: rgba(255,59,48,0.2); color: #fff; }
  </style>
</head>
<body>

  <div class="header">
    <div class="tl"></div>
    <div class="brand">
      <span class="brand-pill">SAB</span>
      <span class="brand-sep">/</span>
      <span class="brand-name">Sony ATEM Bridge</span>
    </div>
    <div class="spacer"></div>
    <span class="ver-badge" id="ver">v—</span>
  </div>

  <div class="content">

    <!-- Status -->
    <div class="status-card">
      <div class="dot starting" id="dot"></div>
      <div class="status-info">
        <div class="status-label" id="statusLabel">Starting…</div>
        <div class="status-sub"   id="statusSub">http://localhost:7777</div>
      </div>
    </div>

    <!-- Available at -->
    <div>
      <div class="section-title">Available at</div>
      <div class="url-list" id="urlList"></div>
    </div>

    <!-- Buttons -->
    <div class="btn-row">
      <button class="btn btn-primary" id="openBtn" onclick="openBest()" disabled>Open UI</button>
      <button class="btn btn-ghost"   onclick="window.electron.hide()">Hide</button>
      <button class="btn btn-danger"  onclick="window.electron.quit()">Quit</button>
    </div>

  </div>

  <script>
    const PORT = 7777;
    let ifaces = [];

    function render({ status, interfaces }) {
      ifaces = interfaces || [];

      // dot
      document.getElementById('dot').className = 'dot ' + status;

      // label
      document.getElementById('statusLabel').textContent =
        status === 'starting' ? 'Starting…' :
        status === 'running'  ? 'Running'   : 'Error';

      // primary URL (first non-localhost)
      const primary = ifaces.find(i => i.address !== '127.0.0.1') || ifaces[0];
      document.getElementById('statusSub').textContent =
        primary ? `http://${primary.address}:${PORT}` : `http://localhost:${PORT}`;

      // button
      document.getElementById('openBtn').disabled = status !== 'running';

      // URL list
      const list = document.getElementById('urlList');
      list.innerHTML = ifaces.map(i => {
        const url   = `http://${i.address}:${PORT}`;
        const label = i.address === '127.0.0.1' ? 'localhost' : i.name;
        return `<div class="url-row" onclick="openExternal('${esc(url)}')">
          <span class="url-iface">${esc(label)}</span>
          <span class="url-addr">${esc(url)}</span>
          <span class="url-arrow">↗</span>
        </div>`;
      }).join('');
    }

    function openExternal(url) { window.electron.openUrl(url); }

    function openBest() {
      const p = ifaces.find(i => i.address !== '127.0.0.1') || ifaces[0];
      if (p) openExternal(`http://${p.address}:${PORT}`);
    }

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Disable right-click context menu
    document.addEventListener('contextmenu', e => e.preventDefault());

    // Traffic-lights spacer is only needed on macOS (hiddenInset title bar)
    if (window.electron.platform !== 'darwin') {
      document.querySelector('.tl').style.display = 'none';
    }

    // Init
    window.electron.getAppVersion().then(v => {
      document.getElementById('ver').textContent = 'v' + v;
    });
    window.electron.getStatus().then(render);
    window.electron.onStatusUpdate(render);
  </script>

</body>
</html>
