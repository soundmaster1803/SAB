      if (logFilter === 'ALL' || logFilter === entry.category) {
        const row = document.createElement('div');
        row.className = 'log-entry';
        row.innerHTML = `<span class="log-ts">${esc(entry.timestamp)}</span>
          <span class="log-cat cat-${esc(entry.category)}">[${esc(entry.category)}]</span>
          <span class="log-text">${esc(entry.text)}</span>`;
        logScroll.appendChild(row);
        if (logScroll.children.length > MAX_LOG) logScroll.firstChild.remove();
        logScroll.scrollTop = logScroll.scrollHeight;
      }
    }

    // ── Tally bar ─────────────────────────────────────────────────────────────
    const tallyInputsEl = document.getElementById('tally-inputs');
    let tallyCount = 0;

    function buildTallyButtons(count) {
      if (count === tallyCount) return;
      tallyCount = count;
      tallyInputsEl.innerHTML = '';
      for (let i = 1; i <= count; i++) {
        const btn = document.createElement('div');
        btn.className = 'tally-btn';
        btn.id = `tally-${i}`;
        btn.textContent = String(i);
        tallyInputsEl.appendChild(btn);
      }
    }
    buildTallyButtons(8);

    let lastInputCount = 20;
    function applyInputCount(n) {
      if (!n || n === lastInputCount) return;
      lastInputCount = n;
      const mAtem  = document.getElementById('m-atem');
      const mLabel = document.getElementById('m-atem-label');
      if (mAtem)  mAtem.max = String(n);
      if (mLabel) mLabel.textContent = `ATEM Input (1–${n})`;
      document.querySelectorAll('.js-atem-id').forEach(el => { el.max = String(n); });
    }

    function syncTally(tally, topology, atemConnected, inputCount) {
      const n = inputCount > 0 ? inputCount : 8;
      applyInputCount(inputCount > 0 ? inputCount : lastInputCount);
      buildTallyButtons(n);
      for (let i = 1; i <= n; i++) {
        const btn = document.getElementById(`tally-${i}`);
        if (!btn) continue;
        const idx = Array.isArray(topology) ? topology.indexOf(i) : i - 1;
        const val = (idx >= 0 && tally) ? tally[idx] : 0;
        btn.classList.toggle('disconnected', !atemConnected);
        btn.classList.toggle('pgm', atemConnected && val === 1);
        btn.classList.toggle('pvw', atemConnected && val === 2);
      }
    }

    // ── Network interfaces ────────────────────────────────────────────────────
    async function loadInterfaces() {
      try {
        const list = await api('GET', '/api/interfaces');
        if (!Array.isArray(list) || list.length === 0) return;
        ifaceList = list;

        const countLabel = document.getElementById('iface-count-label');
        if (countLabel) countLabel.textContent = list.length === 1
          ? list[0].address
          : `${list.length} IPs`;

        ifaceDropdown.innerHTML = '<div class="iface-dropdown-title">Open in browser</div>'
          + list.map(iface => `
            <div class="iface-entry" data-url="http://${iface.address}:7777">
              <span class="iface-entry-name">${esc(iface.name)}</span>
              <span class="iface-entry-url">http://${esc(iface.address)}:7777</span>
            </div>`).join('');

        ifaceDropdown.querySelectorAll('.iface-entry').forEach(el => {
          el.addEventListener('click', e => {
            e.stopPropagation();
            window.open(el.dataset.url, '_blank');
            ifaceDropdown.classList.remove('open');
          });
        });

        ifacePill.style.display = 'flex';
      } catch (_e) {}
    }

    // Toggle dropdown
    ifacePill.addEventListener('click', e => {
      e.stopPropagation();
      ifaceDropdown.classList.toggle('open');
    });
    document.addEventListener('click', () => ifaceDropdown.classList.remove('open'));

    // ── WebSocket ─────────────────────────────────────────────────────────────
    function connect() {
      const ws = new WebSocket(`ws://${window.location.host}`);

      ws.addEventListener('open', () => {
        wsDot.classList.add('on');
        loadInterfaces();
      });

      ws.addEventListener('message', e => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'state') {
            // Version badge
            if (msg.version) {
              const badge = document.getElementById('ver-badge');
              if (badge) badge.textContent = 'v' + msg.version;
            }
            // ATEM state
            if (msg.atemIp && document.activeElement !== atemIpInput) atemIpInput.value = msg.atemIp;
            const connected = !!msg.atemConnected;
            atemDot.classList.toggle('on', connected);
            atemIpInput.disabled = connected;
            btnAtemConnect.textContent = connected ? 'Disconnect' : 'Connect';
            btnAtemConnect.classList.toggle('disconnect', connected);
            // Cameras + tally
            syncCameras(msg.cameras || []);
            syncTally(msg.tally, msg.topology, connected, msg.inputCount || 0);
          } else if (msg.type === 'logs') {
            for (const entry of (msg.entries || [])) {
              pushLog({ category: entry.category || 'SYSTEM', text: entry.text || '', timestamp: entry.timestamp || '' });
            }
          }
        } catch (err) { console.error('[WS]', err); }
      });

      ws.addEventListener('close', () => {
        wsDot.classList.remove('on');
        ifacePill.style.display = 'none';
        setTimeout(connect, 3000);
      });

      ws.addEventListener('error', () => ws.close());
    }

    connect();
  </script>
</body>
</html>
